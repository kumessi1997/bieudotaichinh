<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hourly Wage Chart</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chartjs-plugin-datalabels/2.0.0/chartjs-plugin-datalabels.min.js"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f4f4;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            margin: 0;
            color: #333;
        }

        .chart-header {
            width: 90%;
            max-width: 1000px; /* Wider for grouped bars */
            text-align: center;
            margin-bottom: 20px;
        }
        .chart-header h1 {
            font-size: 1.8em;
            color: #071C2C; /* Default Title Color */
            margin-bottom: 5px;
        }

        /* Control Panel */
        .controls {
            background: white;
            padding: 15px 25px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            margin-bottom: 20px;
            display: flex;
            gap: 20px;
            align-items: center;
            flex-wrap: wrap;
            justify-content: center;
        }

        .control-group {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        label {
            font-weight: 600;
            color: #58595B; /* Default Label Color */
            font-size: 13px;
        }

        input[type="color"] {
            border: none;
            width: 35px;
            height: 35px;
            cursor: pointer;
            background: none;
            padding: 0;
            border-radius: 4px;
        }

        /* Chart Card */
        .chart-card {
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            width: 90%;
            max-width: 1000px; /* Wider for grouped bars */
            height: 500px;
            margin-bottom: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Table Styling */
        .table-container {
            width: 90%;
            max-width: 1000px;
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
        }

        th, td {
            padding: 12px 8px; /* Slightly less padding for more columns */
            text-align: center;
            border-bottom: 1px solid #eee;
        }

        th {
            background-color: #071C2C;
            color: white;
            font-weight: 600;
        }

        tr:hover {
            background-color: #f9f9f9;
        }

        input[type="number"] {
            width: 60px;
            padding: 5px;
            border: 1px solid #ddd;
            border-radius: 4px;
            text-align: center;
            font-family: inherit;
            font-size: 14px;
            transition: border-color 0.3s;
        }

        input[type="number"]:focus {
            border-color: #8B7053;
            outline: none;
            background-color: #fffdf5;
        }
    </style>
</head>
<body>

<div class="chart-header">
    <h1>Relatively low hourly wage ($US)</h1>
</div>

<div class="controls">
    <div class="control-group">
        <label for="vietnamColor">Vietnam:</label>
        <input type="color" id="vietnamColor" value="#01579B"> 
    </div>
    <div class="control-group">
        <label for="thailandColor">Thailand:</label>
        <input type="color" id="thailandColor" value="#E0E0E0"> 
    </div>
    <div class="control-group">
        <label for="philippinesColor">Philippines:</label>
        <input type="color" id="philippinesColor" value="#C0C0C0"> 
    </div>
    <div class="control-group">
        <label for="malaysiaColor">Malaysia:</label>
        <input type="color" id="malaysiaColor" value="#A0A0A0"> 
    </div>
    <div class="control-group">
        <label for="indiaColor">India:</label>
        <input type="color" id="indiaColor" value="#808080"> 
    </div>
    <div class="control-group">
        <label for="chinaColor">China:</label>
        <input type="color" id="chinaColor" value="#606060"> 
    </div>
    <div class="control-group">
        <label for="textColor">Text & Grids:</label>
        <input type="color" id="textColor" value="#58595B"> 
    </div>
    <div class="control-group">
        <label for="titleColor">Chart Title:</label>
        <input type="color" id="titleColor" value="#071C2C"> 
    </div>
</div>

<div class="chart-card">
    <canvas id="hourlyWageChart"></canvas>
</div>

<div class="table-container">
    <h3>Edit Data Below to Update Chart</h3>
    <table id="dataTable">
        <thead>
            <tr>
                <th>Country</th>
                <th>2023e</th>
                <th>2024e</th>
                <th>2025f</th>
            </tr>
        </thead>
        <tbody>
            </tbody>
    </table>
</div>

<script>
    Chart.register(ChartDataLabels);

    const ctx = document.getElementById('hourlyWageChart').getContext('2d');

    // --- Data from your image ---
    const years = ['2023e', '2024e', '2025f'];
    const countries = ['Vietnam', 'Thailand', 'Philippines', 'Malaysia', 'India', 'China'];

    // Data structured by country for datasets
    const countryData = {
        'Vietnam':     [1.7, 1.7, 1.7],
        'Thailand':    [1.4, 1.4, 1.4],
        'Philippines': [3.0, 3.0, 3.2],
        'Malaysia':    [6.1, 6.2, 6.6],
        'India':       [4.4, 4.8, 4.9],
        'China':       [7.5, 7.7, 8.0]
    };

    // --- Color Management ---
    let currentVietnamColor = document.getElementById('vietnamColor').value;
    let currentThailandColor = document.getElementById('thailandColor').value;
    let currentPhilippinesColor = document.getElementById('philippinesColor').value;
    let currentMalaysiaColor = document.getElementById('malaysiaColor').value;
    let currentIndiaColor = document.getElementById('indiaColor').value;
    let currentChinaColor = document.getElementById('chinaColor').value;
    let currentTextColor = document.getElementById('textColor').value;
    let currentTitleColor = document.getElementById('titleColor').value;

    function getDatasetColors() {
        return {
            'Vietnam': currentVietnamColor,
            'Thailand': currentThailandColor,
            'Philippines': currentPhilippinesColor,
            'Malaysia': currentMalaysiaColor,
            'India': currentIndiaColor,
            'China': currentChinaColor,
        };
    }

    // --- Chart Configuration ---
    const hourlyWageChart = new Chart(ctx, {
        type: 'bar',
        data: {
            labels: years,
            datasets: countries.map(country => ({
                label: country,
                data: countryData[country],
                backgroundColor: getDatasetColors()[country],
                borderRadius: 2, // Slight rounding for bars
                datalabels: {
                    anchor: 'end',
                    align: 'top',
                    offset: 4,
                    color: currentTextColor,
                    font: { size: 11, weight: 'bold' },
                    formatter: (value) => value.toFixed(1) // Format to one decimal place
                }
            }))
        },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: {
                legend: {
                    position: 'bottom', // Legend at the bottom as in image
                    labels: {
                        color: currentTextColor,
                        font: { size: 12 },
                        boxWidth: 20
                    }
                },
                tooltip: {
                    callbacks: {
                        label: (ctx) => `${ctx.dataset.label}: $${ctx.raw.toFixed(1)}`
                    }
                }
            },
            scales: {
                y: {
                    beginAtZero: true,
                    max: 9, // Max of Y-axis from image
                    grid: { color: '#e0e0e0', borderDash: [2, 2] },
                    ticks: { 
                        color: currentTextColor,
                        font: { size: 12 },
                        callback: function(value) { return value.toFixed(0); } // Display as whole numbers
                    }
                },
                x: {
                    grid: { display: false },
                    ticks: { 
                        color: currentTextColor,
                        font: { size: 13, weight: 'bold' }
                    }
                }
            }
        }
    });

    // --- Generate Table Logic ---
    const tableBody = document.querySelector('#dataTable tbody');

    function renderTable() {
        tableBody.innerHTML = ''; 
        
        countries.forEach((countryName, countryIndex) => {
            const tr = document.createElement('tr');
            
            // Country Name Cell
            const tdCountry = document.createElement('td');
            tdCountry.textContent = countryName;
            tr.appendChild(tdCountry);
            
            // Input Cells for each year
            years.forEach((year, yearIndex) => {
                const tdVal = document.createElement('td');
                const input = document.createElement('input');
                input.type = 'number';
                input.step = '0.1'; // Allow decimals for wages
                input.value = hourlyWageChart.data.datasets[countryIndex].data[yearIndex];
                
                input.addEventListener('input', (e) => {
                    const newValue = parseFloat(e.target.value);
                    updateChartData(countryIndex, yearIndex, newValue);
                });
                
                tdVal.appendChild(input);
                tr.appendChild(tdVal);
            });
            tableBody.appendChild(tr);
        });
    }

    // --- Update Chart Data from Table ---
    function updateChartData(countryDatasetIndex, yearDataIndex, newValue) {
        hourlyWageChart.data.datasets[countryDatasetIndex].data[yearDataIndex] = newValue;
        hourlyWageChart.update(); 
    }

    // --- Update Chart Colors from Controls ---
    function updateChartColors() {
        currentVietnamColor = document.getElementById('vietnamColor').value;
        currentThailandColor = document.getElementById('thailandColor').value;
        currentPhilippinesColor = document.getElementById('philippinesColor').value;
        currentMalaysiaColor = document.getElementById('malaysiaColor').value;
        currentIndiaColor = document.getElementById('indiaColor').value;
        currentChinaColor = document.getElementById('chinaColor').value;
        currentTextColor = document.getElementById('textColor').value;
        currentTitleColor = document.getElementById('titleColor').value;

        // Update Dataset Colors
        const newColors = getDatasetColors();
        hourlyWageChart.data.datasets.forEach(dataset => {
            dataset.backgroundColor = newColors[dataset.label];
            dataset.datalabels.color = currentTextColor; // Update datalabel color
        });
        
        // Update Options Colors
        document.querySelector('.chart-header h1').style.color = currentTitleColor;
        hourlyWageChart.options.scales.y.ticks.color = currentTextColor;
        hourlyWageChart.options.scales.y.grid.color = currentTextColor + '33'; // Slightly transparent grid
        hourlyWageChart.options.scales.x.ticks.color = currentTextColor;
        hourlyWageChart.options.plugins.legend.labels.color = currentTextColor;
        
        hourlyWageChart.update();
    }

    // --- Add Event Listeners ---
    document.getElementById('vietnamColor').addEventListener('input', updateChartColors);
    document.getElementById('thailandColor').addEventListener('input', updateChartColors);
    document.getElementById('philippinesColor').addEventListener('input', updateChartColors);
    document.getElementById('malaysiaColor').addEventListener('input', updateChartColors);
    document.getElementById('indiaColor').addEventListener('input', updateChartColors);
    document.getElementById('chinaColor').addEventListener('input', updateChartColors);
    document.getElementById('textColor').addEventListener('input', updateChartColors);
    document.getElementById('titleColor').addEventListener('input', updateChartColors);

    // Initial Render
    renderTable();
</script>

</body>
</html>
