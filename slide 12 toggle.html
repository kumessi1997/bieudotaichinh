<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Slide 12 Toggle Layout</title>
    <style>
        :root {
            color-scheme: light dark;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: "Segoe UI", Arial, sans-serif;
            background: #f3f4f6;
            color: #111;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            gap: 16px;
            padding: 24px;
        }

        .controls {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            justify-content: center;
        }

        .controls button {
            border: none;
            border-radius: 999px;
            padding: 10px 20px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            color: #fff;
            background: #1f2933;
            transition: transform 0.15s ease, opacity 0.2s ease;
        }

        .controls button.is-active {
            background: #8b7053;
            transform: translateY(-1px);
        }

        .controls button:focus-visible {
            outline: 2px solid #f1b24a;
            outline-offset: 2px;
        }

        .controls button:hover:not(.is-active) {
            opacity: 0.85;
        }

        main {
            flex: 1;
            display: flex;
        }

        main {
            flex: 1;
            display: flex;
            justify-content: center;
        }

        .panel {
            flex: 1;
            display: flex;
            gap: 20px;
            width: 100%;
            max-width: 1100px;
            margin: 0 auto;
            min-height: 60vh;
        }

        iframe {
            border: none;
            border-radius: 12px;
            background: #fff;
            box-shadow: 0 8px 30px rgba(14, 30, 37, 0.12);
            transition: flex 0.35s ease, opacity 0.25s ease;
            height: 600px;
        }

        .panel.show-chart1 .chart2,
        .panel.show-chart2 .chart1 {
            opacity: 0;
            pointer-events: none;
        }

        .panel.show-chart1 .chart1,
        .panel.show-chart2 .chart2 {
            flex: 1;
        }

        @media (max-width: 980px) {
            body {
                padding: 16px;
            }

            .panel {
                flex-direction: column;
                gap: 16px;
            }

            iframe {
                width: 100%;
                height: 600px;
            }
        }
    </style>
</head>
<body>
    <div class="controls" role="group" aria-label="Toggle charts">
        <button type="button" data-view="chart1" class="is-active">
            Highest Urban Population Growth
        </button>
        <button type="button" data-view="chart2">
            Average Top 100 Listed Compensation
        </button>
    </div>

    <main>
        <section class="panel show-chart1" id="panel">
            <iframe
                class="chart1"
                title="Slide 12 Chart 1"
                src="slide 12 chart 1.html"
            ></iframe>
            <iframe
                class="chart2"
                title="Slide 12 Chart 2"
                src="slide 12 chart 2.html"
            ></iframe>
        </section>
    </main>

    <script>
        const panel = document.getElementById("panel");
        const buttons = document.querySelectorAll(".controls button");

        function setView(view) {
            panel.classList.remove("show-chart1", "show-chart2");
            panel.classList.add(`show-${view}`);

            buttons.forEach((btn) => {
                btn.classList.toggle("is-active", btn.dataset.view === view);
            });
        }

        buttons.forEach((button) => {
            button.addEventListener("click", () => setView(button.dataset.view));
        });
    </script>
</body>
</html>
