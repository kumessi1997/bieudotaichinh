<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Investor Trading Accounts Chart</title>
    <!-- 1. Load Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 2. Load Chart.js for the chart -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        /* Use the Inter font, which is clean and modern */
        body {
            font-family: 'Inter', sans-serif;
        }
        /* Improve the appearance of color pickers */
        input[type="color"] {
            -webkit-appearance: none;
            -moz-appearance: none;
            appearance: none;
            width: 44px;
            height: 44px;
            padding: 0;
            border: none;
            border-radius: 0.5rem;
            cursor: pointer;
        }
        input[type="color"]::-webkit-color-swatch {
            border: none;
            border-radius: 0.375rem;
            padding: 0;
        }
        input[type="color"]::-moz-color-swatch {
            border: none;
            border-radius: 0.375rem;
            padding: 0;
        }
    </style>
    <!-- Pre-load Inter font from Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="bg-gray-100 text-gray-900">

    <div class="container mx-auto max-w-7xl p-4 md:p-8">
        <h1 class="text-3xl font-bold text-gray-900 mb-6">Investor Accounts Analysis</h1>

        <!-- Color Controls -->
        <div class="mb-6 p-6 bg-white rounded-lg shadow-sm border border-gray-200">
            <h2 class="text-xl font-semibold mb-4">Chart Color Controls</h2>
            <div class="flex flex-wrap gap-6">
                <div class="flex flex-col">
                    <label for="lineColor" class="mb-2 font-medium text-sm text-gray-700">Total Accounts (Line)</label>
                    <input type="color" id="lineColor" value="#8B7053">
                </div>
                <div class="flex flex-col">
                    <label for="barColor" class="mb-2 font-medium text-sm text-gray-700">New Accounts (Bar)</label>
                    <input type="color" id="barColor" value="#071C2C">
                </div>
                <div class="flex flex-col">
                    <label for="textColor" class="mb-2 font-medium text-sm text-gray-700">Text & Grids</label>
                    <input type="color" id="textColor" value="#58595B">
                </div>
            </div>
        </div>

        <!-- Chart Canvas -->
        <div class="mb-8 p-6 bg-white rounded-lg shadow-sm border border-gray-200">
            <!-- Set a fixed aspect ratio for the chart container -->
            <div class="relative h-[300px] md:h-[500px]">
                <canvas id="myChart"></canvas>
            </div>
        </div>

        <!-- Data Table for Editing -->
        <div class="p-6 bg-white rounded-lg shadow-sm border border-gray-200">
            <h2 class="text-xl font-semibold mb-4">Edit Chart Data</h2>
            <div class="overflow-x-auto">
                <table class="min-w-full divide-y divide-gray-200">
                    <thead class="bg-gray-50">
                        <tr>
                            <th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Date</th>
                            <th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Total Accounts (Thousands)</th>
                            <th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">New Accounts (Thousands)</th>
                        </tr>
                    </thead>
                    <tbody id="dataTableBody" class="bg-white divide-y divide-gray-200">
                        <!-- Rows will be injected by JavaScript -->
                    </tbody>
                </table>
            </div>
            <button id="updateChartBtn" class="mt-6 px-5 py-2.5 bg-blue-600 text-white font-medium rounded-lg shadow-sm hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-opacity-50 transition-colors">
                Update Chart from Table
            </button>
        </div>

    </div>

    <script>
        // --- 1. INITIAL DATA ---
        // Data extracted from the chart image
        let chartLabels = ['1/9/19', '1/1/20', '1/5/20', '1/9/20', '1/1/21', '1/5/21', '1/9/21', '1/1/22', '1/5/22', '1/9/22', '1/1/23', '1/5/23', '1/9/23', '1/1/24', '1/5/24', '1/9/24', '1/1/25', '1/5/25', '1/9/25'];
        let totalAccountsData = [2350, 2400, 2550, 2700, 2900, 3300, 3900, 4800, 5600, 6400, 6900, 7200, 7800, 7300, 7800, 8200, 9300, 10100, 11044];
        let newAccountsData = [30, 40, 50, 60, 85, 110, 130, 200, -400, -200, 90, 110, 150, 90, 130, 160, 190, 240, 320];
        
        // Initial color palette from user request
        const initialColors = {
            line: '#8B7053',
            bar: '#071C2C',
            text: '#58595B'
        };

        // --- 2. GLOBAL VARIABLES ---
        let myChart;
        const ctx = document.getElementById('myChart').getContext('2d');
        const tableBody = document.getElementById('dataTableBody');
        const updateChartBtn = document.getElementById('updateChartBtn');
        const lineColorPicker = document.getElementById('lineColor');
        const barColorPicker = document.getElementById('barColor');
        const textColorPicker = document.getElementById('textColor');

        // --- 3. CHART CREATION FUNCTION ---
        function createChart(labels, lineData, barData, colors) {
            if (myChart) {
                myChart.destroy();
            }
            myChart = new Chart(ctx, {
                type: 'bar', // Default type
                data: {
                    labels: labels,
                    datasets: [
                        {
                            type: 'line', // Override to line
                            label: 'Total Accounts (Thousands)',
                            data: lineData,
                            borderColor: colors.line,
                            backgroundColor: colors.line,
                            yAxisID: 'yLeft',
                            tension: 0.1,
                            pointRadius: 3,
                            pointHoverRadius: 6,
                        },
                        {
                            type: 'bar', // Explicitly bar
                            label: 'New Accounts (Thousands)',
                            data: barData,
                            borderColor: colors.bar,
                            backgroundColor: colors.bar,
                            yAxisID: 'yRight',
                        }
                    ]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    interaction: {
                        mode: 'index',
                        intersect: false,
                    },
                    stacked: false,
                    plugins: {
                        legend: {
                            labels: {
                                color: colors.text
                            }
                        },
                        tooltip: {
                            titleFont: { size: 14 },
                            bodyFont: { size: 12 },
                            padding: 10,
                            cornerRadius: 4,
                            boxPadding: 4
                        }
                    },
                    scales: {
                        x: {
                            ticks: { color: colors.text },
                            grid: { color: 'rgba(0, 0, 0, 0.05)' }
                        },
                        yLeft: {
                            type: 'linear',
                            position: 'left',
                            title: {
                                display: true,
                                text: 'Total Accounts (Thousands)',
                                color: colors.text
                            },
                            ticks: { color: colors.text },
                            grid: { color: 'rgba(0, 0, 0, 0.1)' }
                        },
                        yRight: {
                            type: 'linear',
                            position: 'right',
                            title: {
                                display: true,
                                text: 'New Accounts (Thousands)',
                                color: colors.text
                            },
                            ticks: { color: colors.text },
                            grid: { display: false } // Hide grid for this axis
                        }
                    }
                }
            });
        }

        // --- 4. DATA TABLE FUNCTIONS ---
        function populateTable() {
            tableBody.innerHTML = ''; // Clear existing rows
            const inputClasses = "w-full px-3 py-2 bg-gray-50 border border-gray-300 rounded-md text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent";

            for (let i = 0; i < chartLabels.length; i++) {
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td class="px-4 py-2 whitespace-nowrap">
                        <input type="text" value="${chartLabels[i]}" class="${inputClasses}">
                    </td>
                    <td class="px-4 py-2 whitespace-nowrap">
                        <input type="number" value="${totalAccountsData[i]}" class="${inputClasses}">
                    </td>
                    <td class="px-4 py-2 whitespace-nowrap">
                        <input type="number" value="${newAccountsData[i]}" class="${inputClasses}">
                    </td>
                `;
                tableBody.appendChild(row);
            }
        }

        function updateChartFromTable() {
            const rows = tableBody.querySelectorAll('tr');
            const newLabels = [];
            const newLineData = [];
            const newBarData = [];

            rows.forEach(row => {
                const inputs = row.querySelectorAll('input');
                newLabels.push(inputs[0].value);
                newLineData.push(parseFloat(inputs[1].value) || 0);
                newBarData.push(parseFloat(inputs[2].value) || 0);
            });

            // Update global data arrays
            chartLabels = newLabels;
            totalAccountsData = newLineData;
            newAccountsData = newBarData;

            // Update chart data
            myChart.data.labels = newLabels;
            myChart.data.datasets[0].data = newLineData;
            myChart.data.datasets[1].data = newBarData;
            myChart.update();
        }

        // --- 5. COLOR UPDATE FUNCTION ---
        function updateChartColors() {
            const newColors = {
                line: lineColorPicker.value,
                bar: barColorPicker.value,
                text: textColorPicker.value
            };

            // Update dataset colors
            myChart.data.datasets[0].borderColor = newColors.line;
            myChart.data.datasets[0].backgroundColor = newColors.line;
            myChart.data.datasets[1].borderColor = newColors.bar;
            myChart.data.datasets[1].backgroundColor = newColors.bar;

            // Update scale and legend colors
            myChart.options.plugins.legend.labels.color = newColors.text;
            myChart.options.scales.x.ticks.color = newColors.text;
            myChart.options.scales.x.title.color = newColors.text;
            myChart.options.scales.yLeft.ticks.color = newColors.text;
            myChart.options.scales.yLeft.title.color = newColors.text;
            myChart.options.scales.yRight.ticks.color = newColors.text;
            myChart.options.scales.yRight.title.color = newColors.text;
            
            myChart.update();
        }

        // --- 6. INITIALIZATION ---
        window.onload = () => {
            // Set initial color picker values
            lineColorPicker.value = initialColors.line;
            barColorPicker.value = initialColors.bar;
            textColorPicker.value = initialColors.text;

            // Create the table and chart
            populateTable();
            createChart(chartLabels, totalAccountsData, newAccountsData, initialColors);

            // Add event listeners
            updateChartBtn.addEventListener('click', updateChartFromTable);
            lineColorPicker.addEventListener('input', updateChartColors);
            barColorPicker.addEventListener('input', updateChartColors);
            textColorPicker.addEventListener('input', updateChartColors);
        };
    </script>
</body>
</html>
