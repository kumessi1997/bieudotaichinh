<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Market Performance Chart</title>
    <!-- 1. Load Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 2. Load Chart.js for the chart -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        /* Use the Inter font, which is clean and modern */
        body {
            font-family: 'Inter', sans-serif;
        }
        /* Improve the appearance of color pickers */
        input[type="color"] {
            -webkit-appearance: none;
            -moz-appearance: none;
            appearance: none;
            width: 44px;
            height: 44px;
            padding: 0;
            border: none;
            border-radius: 0.5rem;
            cursor: pointer;
        }
        input[type="color"]::-webkit-color-swatch {
            border: none;
            border-radius: 0.375rem;
            padding: 0;
        }
        input[type="color"]::-moz-color-swatch {
            border: none;
            border-radius: 0.375rem;
            padding: 0;
        }
    </style>
    <!-- Pre-load Inter font from Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="bg-gray-100 text-gray-900">

    <div class="container mx-auto max-w-7xl p-4 md:p-8">
        <h1 class="text-3xl font-bold text-gray-900 mb-6">Market Performance After FTSE Russel Upgrade</h1>

        <!-- Color Controls -->
        <div class="mb-6 p-6 bg-white rounded-lg shadow-sm border border-gray-200">
            <h2 class="text-xl font-semibold mb-4">Chart Color Controls</h2>
            <div class="flex flex-wrap gap-6">
                <div class="flex flex-col">
                    <label for="bar1Color" class="mb-2 font-medium text-sm text-gray-700">"After 1 year" Bar</label>
                    <input type="color" id="bar1Color" value="#8B7053">
                </div>
                <div class="flex flex-col">
                    <label for="bar2Color" class="mb-2 font-medium text-sm text-gray-700">"After 3 years" Bar</label>
                    <input type="color" id="bar2Color" value="#071C2C">
                </div>
                <div class="flex flex-col">
                    <label for="textColor" class="mb-2 font-medium text-sm text-gray-700">Text & Grids</label>
                    <input type="color" id="textColor" value="#58595B">
                </div>
            </div>
        </div>

        <!-- Chart Canvas -->
        <div class="mb-8 p-6 bg-white rounded-lg shadow-sm border border-gray-200">
            <!-- Set a fixed aspect ratio for the chart container -->
            <div class="relative h-[300px] md:h-[500px]">
                <canvas id="myChart"></canvas>
            </div>
        </div>

        <!-- Data Table for Editing -->
        <div class="p-6 bg-white rounded-lg shadow-sm border border-gray-200">
            <h2 class="text-xl font-semibold mb-4">Edit Chart Data</h2>
            <div class="overflow-x-auto">
                <table class="min-w-full divide-y divide-gray-200">
                    <thead class="bg-gray-50">
                        <tr>
                            <th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Country</th>
                            <th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">After 1 year (%)</th>
                            <th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">After 3 years (%)</th>
                        </tr>
                    </thead>
                    <tbody id="dataTableBody" class="bg-white divide-y divide-gray-200">
                        <!-- Rows will be injected by JavaScript -->
                    </tbody>
                </table>
            </div>
            <button id="updateChartBtn" class="mt-6 px-5 py-2.5 bg-blue-600 text-white font-medium rounded-lg shadow-sm hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-opacity-50 transition-colors">
                Update Chart from Table
            </button>
        </div>

    </div>

    <script>
        // --- 1. INITIAL DATA ---
        // Data extracted from the chart image (as percentages)
        let chartLabels = ['Kuwait', 'Saudi Arabia', 'Pakistan', 'Qatar', 'UAE', 'Thailand', 'Malaysia', 'Indonesia'];
        let dataAfter1Year = [8, 10, -15, -20, 0, 10, 8, 30];
        let dataAfter3Years = [18, 35, -55, 5, 17, 98, 25, 150];
        
        // Initial color palette from user request
        const initialColors = {
            bar1: '#8B7053',
            bar2: '#071C2C',
            text: '#58595B'
        };

        // --- 2. GLOBAL VARIABLES ---
        let myChart;
        const ctx = document.getElementById('myChart').getContext('2d');
        const tableBody = document.getElementById('dataTableBody');
        const updateChartBtn = document.getElementById('updateChartBtn');
        const bar1ColorPicker = document.getElementById('bar1Color');
        const bar2ColorPicker = document.getElementById('bar2Color');
        const textColorPicker = document.getElementById('textColor');

        // --- 3. CHART CREATION FUNCTION ---
        function createChart(labels, bar1Data, bar2Data, colors) {
            if (myChart) {
                myChart.destroy();
            }
            myChart = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: labels,
                    datasets: [
                        {
                            label: 'After 1 year',
                            data: bar1Data,
                            backgroundColor: colors.bar1,
                            borderColor: colors.bar1,
                            borderWidth: 1
                        },
                        {
                            label: 'After 3 years',
                            data: bar2Data,
                            backgroundColor: colors.bar2,
                            borderColor: colors.bar2,
                            borderWidth: 1
                        }
                    ]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: {
                            position: 'bottom',
                            labels: {
                                color: colors.text
                            }
                        },
                        tooltip: {
                            callbacks: {
                                label: function(context) {
                                    let label = context.dataset.label || '';
                                    if (label) {
                                        label += ': ';
                                    }
                                    if (context.parsed.y !== null) {
                                        label += context.parsed.y + '%';
                                    }
                                    return label;
                                }
                            }
                        }
                    },
                    scales: {
                        x: {
                            ticks: { color: colors.text },
                            grid: { display: false }
                        },
                        y: {
                            title: {
                                display: false,
                            },
                            ticks: { 
                                color: colors.text,
                                // Format Y-axis ticks as percentages
                                callback: function(value, index, ticks) {
                                    return value + '%';
                                }
                            },
                            grid: { 
                                color: 'rgba(0, 0, 0, 0.1)',
                                zeroLineColor: colors.text
                            }
                        }
                    }
                }
            });
        }

        // --- 4. DATA TABLE FUNCTIONS ---
        function populateTable() {
            tableBody.innerHTML = ''; // Clear existing rows
            const inputClasses = "w-full px-3 py-2 bg-gray-50 border border-gray-300 rounded-md text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent";

            for (let i = 0; i < chartLabels.length; i++) {
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td class="px-4 py-2 whitespace-nowrap">
                        <input type="text" value="${chartLabels[i]}" class="${inputClasses}">
                    </td>
                    <td class="px-4 py-2 whitespace-nowrap">
                        <input type="number" value="${dataAfter1Year[i]}" class="${inputClasses}">
                    </td>
                    <td class="px-4 py-2 whitespace-nowrap">
                        <input type="number" value="${dataAfter3Years[i]}" class="${inputClasses}">
                    </td>
                `;
                tableBody.appendChild(row);
            }
        }

        function updateChartFromTable() {
            const rows = tableBody.querySelectorAll('tr');
            const newLabels = [];
            const newBar1Data = [];
            const newBar2Data = [];

            rows.forEach(row => {
                const inputs = row.querySelectorAll('input');
                newLabels.push(inputs[0].value);
                newBar1Data.push(parseFloat(inputs[1].value) || 0);
                newBar2Data.push(parseFloat(inputs[2].value) || 0);
            });

            // Update global data arrays
            chartLabels = newLabels;
            dataAfter1Year = newBar1Data;
            dataAfter3Years = newBar2Data;

            // Update chart data
            myChart.data.labels = newLabels;
            myChart.data.datasets[0].data = newBar1Data;
            myChart.data.datasets[1].data = newBar2Data;
            myChart.update();
        }

        // --- 5. COLOR UPDATE FUNCTION ---
        function updateChartColors() {
            const newColors = {
                bar1: bar1ColorPicker.value,
                bar2: bar2ColorPicker.value,
                text: textColorPicker.value
            };

            // Update dataset colors
            myChart.data.datasets[0].backgroundColor = newColors.bar1;
            myChart.data.datasets[0].borderColor = newColors.bar1;
            myChart.data.datasets[1].backgroundColor = newColors.bar2;
            myChart.data.datasets[1].borderColor = newColors.bar2;

            // Update scale and legend colors
            myChart.options.plugins.legend.labels.color = newColors.text;
            myChart.options.scales.x.ticks.color = newColors.text;
            myChart.options.scales.y.ticks.color = newColors.text;
            
            myChart.update();
        }

        // --- 6. INITIALIZATION ---
        window.onload = () => {
            // Set initial color picker values
            bar1ColorPicker.value = initialColors.bar1;
            bar2ColorPicker.value = initialColors.bar2;
            textColorPicker.value = initialColors.text;

            // Create the table and chart
            populateTable();
            createChart(chartLabels, dataAfter1Year, dataAfter3Years, initialColors);

            // Add event listeners
            updateChartBtn.addEventListener('click', updateChartFromTable);
            bar1ColorPicker.addEventListener('input', updateChartColors);
            bar2ColorPicker.addEventListener('input', updateChartColors);
            textColorPicker.addEventListener('input', updateChartColors);
        };
    </script>
</body>
</html>
