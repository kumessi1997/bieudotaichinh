<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>1Y FW PE and Estimate earning growth 2026</title>
    <!-- 1. Load Tailwind CSS for styling --><script src="https://cdn.tailwindcss.com"></script>
    <!-- 2. Load Chart.js --><script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    
    <style>
        /* Use the Inter font, which is clean and modern */
        body {
            font-family: 'Inter', sans-serif;
        }
        /* Improve the appearance of color pickers */
        input[type="color"] {
            -webkit-appearance: none;
            -moz-appearance: none;
            appearance: none;
            width: 44px;
            height: 44px;
            padding: 0;
            border: none;
            border-radius: 0.5rem;
            cursor: pointer;
        }
        input[type="color"]::-webkit-color-swatch {
            border: none;
            border-radius: 0.375rem;
            padding: 0;
        }
        input[type="color"]::-moz-color-swatch {
            border: none;
            border-radius: 0.375rem;
            padding: 0;
        }
    </style>
    <!-- Pre-load Inter font from Google Fonts --><link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="bg-gray-100 text-gray-900">

    <div class="container mx-auto max-w-7xl p-4 md:p-8">
        <h1 class="text-3xl font-bold text-gray-900 mb-6">1Y FW PE and Estimate earning growth 2026</h1>

        <!-- Color Controls --><div class="mb-6 p-6 bg-white rounded-lg shadow-sm border border-gray-200">
            <h2 class="text-xl font-semibold mb-4">Chart Color Controls</h2>
            <div class="flex flex-wrap gap-6">
                <div class="flex flex-col">
                    <label for="barColor" class="mb-2 font-medium text-sm text-gray-700">"FW P/E" Bar Color</label>
                    <input type="color" id="barColor" value="#8B7053">
                </div>
                <div class="flex flex-col">
                    <label for="scatterColor" class="mb-2 font-medium text-sm text-gray-700">"Est. earning growth" Scatter Color</label>
                    <input type="color" id="scatterColor" value="#071C2C">
                </div>
                <div class="flex flex-col">
                    <label for="textColor" class="mb-2 font-medium text-sm text-gray-700">Text & Grids</label>
                    <input type="color" id="textColor" value="#58595B">
                </div>
            </div>
        </div>

        <!-- Chart Canvas --><div class="mb-8 p-6 bg-white rounded-lg shadow-sm border border-gray-200">
            <div class="relative h-[300px] md:h-[500px]">
                <canvas id="myChart"></canvas>
            </div>
        </div>

        <!-- Data Table for Editing --><div class="p-6 bg-white rounded-lg shadow-sm border border-gray-200">
            <h2 class="text-xl font-semibold mb-4">Edit Chart Data</h2>
            <div class="overflow-x-auto">
                <table class="min-w-full divide-y divide-gray-200">
                    <thead class="bg-gray-50">
                        <tr>
                            <th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Country/Region</th>
                            <th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">FW P/E (LHS)</th>
                            <th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Est. earning growth 2026 (RHS %)</th>
                        </tr>
                    </thead>
                    <tbody id="dataTableBody" class="bg-white divide-y divide-gray-200">
                        <!-- Rows will be injected by JavaScript --></tbody>
                </table>
            </div>
            <button id="updateChartBtn" class="mt-6 px-5 py-2.5 bg-blue-600 text-white font-medium rounded-lg shadow-sm hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-opacity-50 transition-colors">
                Update Chart from Table
            </button>
        </div>

    </div>

    <script>
        // --- 1. INITIAL DATA ---
        let chartData = [
            { label: 'Vietnam', pe: 13.5, growth: 14 },
            { label: 'Indonesia', pe: 14.5, growth: 21 },
            { label: 'Malaysia', pe: 15.2, growth: 9 },
            { label: 'Thailand', pe: 11.9, growth: -11 }, // Estimated negative from image
            { label: 'Philippines', pe: 9.8, growth: 10 },
            { label: 'Singapore', pe: 14.2, growth: 7 },
            { label: 'MSCI EM', pe: 15.8, growth: 14 },
            { label: 'China', pe: 15.5, growth: 11 }
        ];

        // Initial color palette from user request
        const initialColors = {
            bar: '#8B7053',
            scatter: '#071C2C',
            text: '#58595B'
        };

        // --- 2. GLOBAL VARIABLES ---
        let myChart;
        const ctx = document.getElementById('myChart').getContext('2d');
        const tableBody = document.getElementById('dataTableBody');
        const updateChartBtn = document.getElementById('updateChartBtn');
        const barColorPicker = document.getElementById('barColor');
        const scatterColorPicker = document.getElementById('scatterColor');
        const textColorPicker = document.getElementById('textColor');

        // --- 3. CHART CREATION FUNCTION ---
        function createChart(data, colors) {
            if (myChart) {
                myChart.destroy();
            }

            const labels = data.map(item => item.label);
            const peData = data.map(item => item.pe);
            const growthData = data.map(item => item.growth); // Growth as percentage

            myChart = new Chart(ctx, {
                type: 'bar', // Default to bar type
                data: {
                    labels: labels,
                    datasets: [
                        {
                            label: 'FW P/E',
                            data: peData,
                            backgroundColor: colors.bar,
                            borderColor: colors.bar,
                            borderWidth: 1,
                            yAxisID: 'y-pe', // Assign to the left Y-axis
                            order: 2 // Render bars behind scatter points
                        },
                        {
                            type: 'scatter', // Overlay with scatter plot
                            label: 'Est. earning growth 2026',
                            data: growthData.map((val, index) => ({ x: labels[index], y: val })), // x-axis uses labels
                            backgroundColor: colors.scatter,
                            borderColor: colors.scatter,
                            pointRadius: 6,
                            pointStyle: 'rectRot', // Diamond shape
                            yAxisID: 'y-growth', // Assign to the right Y-axis
                            order: 1 // Render scatter points on top
                        }
                    ]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: {
                            position: 'bottom',
                            labels: {
                                color: colors.text
                            }
                        },
                        tooltip: {
                            callbacks: {
                                label: function(context) {
                                    let label = context.dataset.label || '';
                                    if (label) {
                                        label += ': ';
                                    }
                                    if (context.dataset.type === 'bar') {
                                        label += context.parsed.y; // PE ratio
                                    } else if (context.dataset.type === 'scatter') {
                                        label += context.parsed.y + '%'; // Growth percentage
                                    }
                                    return label;
                                }
                            }
                        }
                    },
                    scales: {
                        x: {
                            ticks: { color: colors.text },
                            grid: { display: false }
                        },
                        'y-pe': { // Left Y-axis for PE Ratio
                            position: 'left',
                            title: {
                                display: true,
                                text: 'PE ratio',
                                color: colors.text
                            },
                            min: 0,
                            max: 18,
                            ticks: { 
                                color: colors.text,
                                stepSize: 2
                            },
                            grid: { color: 'rgba(0, 0, 0, 0.1)' }
                        },
                        'y-growth': { // Right Y-axis for Growth
                            position: 'right',
                            title: {
                                display: true,
                                text: 'Growth',
                                color: colors.text
                            },
                            min: -15,
                            max: 25,
                            ticks: {
                                color: colors.text,
                                stepSize: 5,
                                callback: function(value, index, ticks) {
                                    return value + '%'; // Format as percentage
                                }
                            },
                            grid: { display: false } // No grid for right axis
                        }
                    }
                }
            });
        }

        // --- 4. DATA TABLE FUNCTIONS ---
        function populateTable() {
            tableBody.innerHTML = ''; // Clear existing rows
            const inputClasses = "w-full px-3 py-2 bg-gray-50 border border-gray-300 rounded-md text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent";

            chartData.forEach(item => {
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td class="px-4 py-2 whitespace-nowrap">
                        <input type="text" value="${item.label}" class="${inputClasses}">
                    </td>
                    <td class="px-4 py-2 whitespace-nowrap">
                        <input type="number" step="0.1" value="${item.pe}" class="${inputClasses}">
                    </td>
                    <td class="px-4 py-2 whitespace-nowrap">
                        <input type="number" step="0.1" value="${item.growth}" class="${inputClasses}">
                    </td>
                `;
                tableBody.appendChild(row);
            });
        }

        function updateChartFromTable() {
            const newChartData = [];
            const rows = tableBody.querySelectorAll('tr');

            rows.forEach(row => {
                const inputs = row.querySelectorAll('input');
                newChartData.push({
                    label: inputs[0].value,
                    pe: parseFloat(inputs[1].value) || 0,
                    growth: parseFloat(inputs[2].value) || 0
                });
            });

            // Update global data array
            chartData = newChartData;

            // Get current colors
            const currentColors = {
                bar: barColorPicker.value,
                scatter: scatterColorPicker.value,
                text: textColorPicker.value
            };

            // Recreate chart with updated data and colors
            createChart(chartData, currentColors);
        }

        // --- 5. COLOR UPDATE FUNCTION ---
        function updateChartColors() {
            const newColors = {
                bar: barColorPicker.value,
                scatter: scatterColorPicker.value,
                text: textColorPicker.value
            };

            // Update dataset colors
            myChart.data.datasets[0].backgroundColor = newColors.bar;
            myChart.data.datasets[0].borderColor = newColors.bar;
            myChart.data.datasets[1].backgroundColor = newColors.scatter;
            myChart.data.datasets[1].borderColor = newColors.scatter;

            // Update scale and legend colors
            myChart.options.plugins.legend.labels.color = newColors.text;
            myChart.options.scales.x.ticks.color = newColors.text;
            myChart.options.scales['y-pe'].title.color = newColors.text;
            myChart.options.scales['y-pe'].ticks.color = newColors.text;
            myChart.options.scales['y-pe'].grid.color = 'rgba(' + parseInt(newColors.text.slice(1,3), 16) + ',' + parseInt(newColors.text.slice(3,5), 16) + ',' + parseInt(newColors.text.slice(5,7), 16) + ', 0.1)';
            myChart.options.scales['y-growth'].title.color = newColors.text;
            myChart.options.scales['y-growth'].ticks.color = newColors.text;
            
            myChart.update();
        }

        // --- 6. INITIALIZATION ---
        window.onload = () => {
            // Set initial color picker values
            barColorPicker.value = initialColors.bar;
            scatterColorPicker.value = initialColors.scatter;
            textColorPicker.value = initialColors.text;

            // Create the table and chart
            populateTable();
            createChart(chartData, initialColors);

            // Add event listeners
            updateChartBtn.addEventListener('click', updateChartFromTable);
            barColorPicker.addEventListener('input', updateChartColors);
            scatterColorPicker.addEventListener('input', updateChartColors);
            textColorPicker.addEventListener('input', updateChartColors);
        };
    </script>
</body>
</html>
