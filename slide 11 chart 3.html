<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>By Sector Chart</title>
    <!-- 1. Load Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 2. Load Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    
    <style>
        /* Use the Inter font, which is clean and modern */
        body {
            font-family: 'Inter', sans-serif;
        }
        /* Improve the appearance of color pickers */
        input[type="color"] {
            -webkit-appearance: none;
            -moz-appearance: none;
            appearance: none;
            width: 100%;
            height: 44px;
            padding: 0;
            border: none;
            border-radius: 0.5rem;
            cursor: pointer;
        }
        input[type="color"]::-webkit-color-swatch {
            border: 1px solid #e2e8f0; /* light gray border */
            border-radius: 0.375rem;
            padding: 0;
        }
        input[type="color"]::-moz-color-swatch {
            border: 1px solid #e2e8f0; /* light gray border */
            border-radius: 0.375rem;
            padding: 0;
        }
    </style>
    <!-- Pre-load Inter font from Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="bg-gray-100 text-gray-900">

    <div class="container mx-auto max-w-7xl p-4 md:p-8">
        <h1 class="text-3xl font-bold text-gray-900 mb-6">Allocation by Sector</h1>

        <!-- Chart and Table Grid -->
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-8">
            
            <!-- Chart Canvas -->
            <div class="p-6 bg-white rounded-lg shadow-sm border border-gray-200">
                <!-- Relative container for chart and center text -->
                <div class="relative h-[400px] md:h-[500px] w-full">
                    <canvas id="myChart"></canvas>
                    <!-- Center Text: Styled to match the image -->
                    <div id="chartCenterText" class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 text-center pointer-events-none">
                        <span class="text-3xl font-bold" style="color: #071C2C;">By</span>
                        <br>
                        <span class="text-3xl font-bold" style="color: #071C2C;">sector</span>
                    </div>
                </div>
            </div>

            <!-- Data Table for Editing -->
            <div class="p-6 bg-white rounded-lg shadow-sm border border-gray-200">
                <h2 class="text-xl font-semibold mb-4">Edit Chart Data & Colors</h2>
                <div class="overflow-x-auto max-h-[500px] overflow-y-auto">
                    <table class="min-w-full divide-y divide-gray-200">
                        <thead class="bg-gray-50 sticky top-0">
                            <tr>
                                <th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Sector</th>
                                <th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Value (%)</th>
                                <th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Color</th>
                            </tr>
                        </thead>
                        <tbody id="dataTableBody" class="bg-white divide-y divide-gray-200">
                            <!-- Rows will be injected by JavaScript -->
                        </tbody>
                    </table>
                </div>
                <button id="updateChartBtn" class="mt-6 w-full px-5 py-2.5 bg-blue-600 text-white font-medium rounded-lg shadow-sm hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-opacity-50 transition-colors">
                    Update Chart
                </button>
            </div>
        </div>

    </div>

    <script>
        // --- 1. GLOBAL VARIABLES ---
        let myChart;
        const ctx = document.getElementById('myChart').getContext('2d');
        const tableBody = document.getElementById('dataTableBody');
        const updateChartBtn = document.getElementById('updateChartBtn');
        const chartCenterText = document.getElementById('chartCenterText');

        // --- 2. INITIAL DATA & COLORS ---
        // Data extracted from the image
        const initialData = [
            { label: 'Services', value: 40.3 },
            { label: 'Industry & Construction', value: 33.1 },
            { label: 'Agriculture, Forestry & Fishery', value: 26.6 }
        ];

        // Requested color palette
        const initialColors = [
            '#071C2C', // Dark blue/black for Services
            '#58595B', // Gray for Industry
            '#8B7053'  // Brown for Agriculture
        ];

        // --- 3. HELPER FUNCTIONS ---

        /**
         * Creates or updates the chart instance
         */
        function createChart(labels, values, colors) {
            if (myChart) {
                myChart.destroy();
            }
            
            myChart = new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels: labels,
                    datasets: [{
                        label: 'Allocation',
                        data: values,
                        backgroundColor: colors,
                        borderColor: '#ffffff', // White border between slices
                        borderWidth: 2
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    cutout: '70%', // Makes it a doughnut chart
                    plugins: {
                        legend: {
                            display: true,
                            position: 'bottom',
                            labels: {
                                padding: 20,
                                boxWidth: 12,
                                font: {
                                    size: 14
                                }
                            }
                        },
                        tooltip: {
                            callbacks: {
                                label: function(context) {
                                    let label = context.label || '';
                                    if (label) {
                                        label += ': ';
                                    }
                                    if (context.parsed !== null) {
                                        label += context.parsed + '%';
                                    }
                                    return label;
                                }
                            }
                        }
                    },
                    // Hide the center text if the chart is too small
                    onResize: (chart) => {
                        const canvas = chart.canvas;
                        const minSize = 200; // Min px height/width to show text
                        if (canvas.offsetHeight < minSize || canvas.offsetWidth < minSize) {
                            chartCenterText.style.display = 'none';
                        } else {
                            chartCenterText.style.display = 'block';
                        }
                    }
                }
            });
        }

        /**
         * Populates the HTML table from the initial data and colors
         */
        function populateTable() {
            tableBody.innerHTML = ''; // Clear existing rows
            const inputClasses = "w-full px-3 py-2 bg-gray-50 border border-gray-300 rounded-md text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent";

            initialData.forEach((item, index) => {
                const color = initialColors[index % initialColors.length];
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td class="px-4 py-2">
                        <input type="text" value="${item.label}" class="${inputClasses} data-label">
                    </td>
                    <td class="px-4 py-2">
                        <input type="number" step="0.01" value="${item.value}" class="${inputClasses} data-value">
                    </td>
                    <td class="px-4 py-2">
                        <input type="color" value="${color}" class="w-full h-11 rounded-md data-color">
                    </td>
                `;
                tableBody.appendChild(row);
            });
        }

        /**
         * Reads data from the table and updates the chart
         */
        function updateChartFromTable() {
            const newLabels = [];
            const newValues = [];
            const newColors = [];
            
            const rows = tableBody.querySelectorAll('tr');

            rows.forEach(row => {
                const label = row.querySelector('.data-label').value;
                const value = parseFloat(row.querySelector('.data-value').value);
                const color = row.querySelector('.data-color').value;
                
                if (label && !isNaN(value)) {
                    newLabels.push(label);
                    newValues.push(value);
                    newColors.push(color);
                }
            });

            // Update chart data
            myChart.data.labels = newLabels;
            myChart.data.datasets[0].data = newValues;
            myChart.data.datasets[0].backgroundColor = newColors;
            myChart.update();
        }

        // --- 4. INITIALIZATION ---
        window.onload = () => {
            // Create the table first
            populateTable();

            // Then create the chart using the initial data
            const labels = initialData.map(d => d.label);
            const values = initialData.map(d => d.value);
            createChart(labels, values, initialColors);

            // Add event listener
            updateChartBtn.addEventListener('click', updateChartFromTable);
        };
    </script>
</body>
</html>
